name: Weekly Analytics Email Digest

on:
  schedule:
    # Runs every Monday at 8:00 AM Melbourne time (UTC 21:00 on Sunday)
    - cron: '0 21 * * 0'
  # Allows triggering manually anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  send-analytics-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Analytics Reporter
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID || '556066686' }}
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
        run: |
          python scripts/send_weekly_analytics.py
